name: Build and Push Docker Image

on:
  push:
    branches: 
       - main
       - DonationsApp
       - notificationService
       - fileUploaderService
  pull_request:
    branches: 
       - main
       - DonationsApp
       - notificationService
       - fileUploaderService

# Ensure that the workflow has permission to write packages.
permissions:
  contents: read
  packages: write
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Build with Maven
        # run: mvn clean package --no-transfer-progress
        run: mvn clean package -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/springboot:latest
            ghcr.io/${{ github.repository_owner }}/springboot:${{ github.sha }}
